const monthKey = (dateStr) => dateStr.slice(0, 7); // YYYY-MM

function monthLabel(key, lang) {
  const [y, m] = key.split("-");
  return T[lang][MONTH_KEYS[parseInt(m, 10) - 1]] + " " + y.slice(2);
}

function availableMonths(lists) {
  const set = new Set([CURRENT_MONTH]);
  lists.forEach((arr) => arr.forEach((item) => set.add(monthKey(item.date))));
  return Array.from(set).sort().reverse();
}

function lastNMonths(n, from) {
  const [y, m] = from.split("-").map(Number);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    let mm = m - i, yy = y;
    while (mm <= 0) { mm += 12; yy -= 1; }
    out.push(yy + "-" + String(mm).padStart(2, "0"));
  }
  return out;
}

/**
 * Keeps one shared document ("household/shared") in sync across every
 * device once a real, authenticated session exists. In local mode (no
 * Firebase configured) it just uses this browser's storage.
 */
function useSharedData(enabled) {
  const [data, setDataRaw] = useState(null);
  const [status, setStatus] = useState(FIREBASE_READY ? "connecting" : "local");
  const docRef = useRef(null);

  useEffect(() => {
    if (!FIREBASE_READY) {
      setDataRaw(loadLocalState() || seedData());
      setStatus("local");
      return;
    }
    if (!enabled) { setStatus("connecting"); return; }
    let unsubSnap = null;
    try {
      const db = firebase.firestore();
      const ref = db.collection("household").doc("shared");
      docRef.current = ref;
      unsubSnap = ref.onSnapshot(
        (snap) => {
          if (snap.exists) {
            setDataRaw(snap.data());
            setStatus("ready");
          } else {
            const seed = seedData();
            ref.set(seed).then(() => { setDataRaw(seed); setStatus("ready"); });
          }
        },
        () => setStatus("error")
      );
    } catch (e) {
      setStatus("error");
    }
    return () => { if (unsubSnap) unsubSnap(); };
  }, [enabled]);

  function setData(updater) {
    setDataRaw((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (status === "local") {
        saveLocalState(next);
      } else if (status === "ready" && docRef.current) {
        docRef.current.set(next).catch(() => {});
      }
      return next;
    });
  }

  return { data, setData, status };
}

/* ---------------------------------------------------------------------- */
/* AUTHENTICATION                                                          */
/* Local mode: a small per-device account store (no backend configured).  */
/* Firebase mode: real Firebase Authentication + Firestore profiles — no  */
/* passwords are ever stored in plain text, and no demo credentials ship. */
/* ---------------------------------------------------------------------- */
function mapAuthError(e) {
  const code = e && e.code;
  if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "wrongPassword";
  if (code === "auth/user-not-found") return "userNotFound";
  if (code === "auth/invalid-email") return "invalidEmail";
  if (code === "auth/email-already-in-use") return "emailInUse";
  if (code === "auth/weak-password") return "weakPassword";
  if (code === "auth/too-many-requests") return "tooManyRequests";
  return "genericError";
}

function useLocalAuth() {
  const [users, setUsersRaw] = useState(null);
  const [currentUserId, setCurrentUserId] = useState(null);

  useEffect(() => {
    let list = [];
    try { list = JSON.parse(localStorage.getItem("ghar_kharch_local_users") || "[]"); } catch (e) {}
    setUsersRaw(list);
    try { setCurrentUserId(localStorage.getItem("ghar_kharch_local_session") || null); } catch (e) {}
  }, []);

  function persistUsers(next) {
    setUsersRaw(next);
    try { localStorage.setItem("ghar_kharch_local_users", JSON.stringify(next)); } catch (e) {}
  }
  function persistSession(id) {
    setCurrentUserId(id);
    try {
      if (id) localStorage.setItem("ghar_kharch_local_session", id);
      else localStorage.removeItem("ghar_kharch_local_session");
    } catch (e) {}
  }

  const currentUser = users && currentUserId ? users.find((u) => u.id === currentUserId) || null : null;
  const status = users === null ? "loading" : users.length === 0 ? "needsBootstrap" : currentUser ? "ready" : "signedOut";

  return {
    mode: "local", status, currentUser, usersList: users,
    bootstrapAdmin: ({ name, username, password }) => {
      const u = { id: uid(), name, username: username.trim(), password, role: "admin", permission: "edit" };
      persistUsers([u]);
      persistSession(u.id);
      return Promise.resolve();
    },
    signIn: (username, password) => {
      const found = (users || []).find((u) => u.username === username.trim() && u.password === password);
      if (!found) return Promise.reject("wrongPassword");
      persistSession(found.id);
      return Promise.resolve();
    },
    signOut: () => persistSession(null),
    addUser: (u) => {
      persistUsers([...(users || []), { ...u, id: uid() }]);
      return Promise.resolve();
    },
    updateUser: (u) => {
      persistUsers((users || []).map((x) => (x.id === u.id ? u : x)));
      return Promise.resolve();
    },
    deleteUser: (id) => {
      persistUsers((users || []).filter((x) => x.id !== id));
      if (id === currentUserId) persistSession(null);
      return Promise.resolve();
    },
    resetPasswordEmail: null,
    changeOwnPassword: (currentPassword, newPassword) => {
      if (!currentUser || currentUser.password !== currentPassword) return Promise.reject("wrongPassword");
      const updated = { ...currentUser, password: newPassword };
      persistUsers((users || []).map((x) => (x.id === currentUser.id ? updated : x)));
      return Promise.resolve();
    },
  };
}

function useFirebaseAuth() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = signed out
  const [profile, setProfile] = useState(undefined); // undefined = loading, null = no profile doc
  const [usersList, setUsersList] = useState(null);

  useEffect(() => {
    if (!FIREBASE_READY) return;
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setAuthUser(u || null);
      if (!u) { setProfile(null); setUsersList(null); }
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!FIREBASE_READY || !authUser) return;
    const unsub = firebase.firestore().collection("profiles").doc(authUser.uid).onSnapshot(
      (snap) => setProfile(snap.exists ? { id: snap.id, ...snap.data() } : null),
      () => setProfile(null)
    );
    return unsub;
  }, [authUser]);

  useEffect(() => {
    if (!FIREBASE_READY || !profile || profile.role !== "admin") { setUsersList(null); return; }
    const unsub = firebase.firestore().collection("profiles").onSnapshot(
      (snap) => setUsersList(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => {}
    );
    return unsub;
  }, [profile]);

  const status = authUser === undefined ? "loading" : authUser === null ? "signedOut" : profile === undefined ? "loading" : profile === null ? "noProfile" : "ready";

  return {
    mode: "firebase", status,
    currentUser: profile && authUser ? { ...profile, id: authUser.uid, email: authUser.email } : null,
    usersList,
    bootstrapAdmin: null,
    signIn: (email, password) => firebase.auth().signInWithEmailAndPassword(email.trim(), password).catch((e) => { throw mapAuthError(e); }),
    signOut: () => firebase.auth().signOut(),
    addUser: ({ name, email, password, role, permission }) => {
      const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, "Secondary-" + Date.now());
      const secondaryAuth = secondaryApp.auth();
      return secondaryAuth.createUserWithEmailAndPassword(email.trim(), password)
        .then((cred) => {
          const newUid = cred.user.uid;
          return secondaryAuth.signOut()
            .then(() => secondaryApp.delete())
            .then(() => firebase.firestore().collection("profiles").doc(newUid).set({ name, email: email.trim(), role, permission }));
        })
        .catch((e) => { throw mapAuthError(e); });
    },
    updateUser: (u) => firebase.firestore().collection("profiles").doc(u.id).set(
      { name: u.name, email: u.email, role: u.role, permission: u.permission }, { merge: true }
    ),
    deleteUser: (id) => firebase.firestore().collection("profiles").doc(id).delete(),
    resetPasswordEmail: (email) => firebase.auth().sendPasswordResetEmail(email),
    changeOwnPassword: (currentPassword, newPassword) => {
      const user = firebase.auth().currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
      return user.reauthenticateWithCredential(cred)
        .then(() => user.updatePassword(newPassword))
        .catch((e) => { throw mapAuthError(e); });
    },
  };
}

function useAuthSystem() {
  const local = useLocalAuth();
  const remote = useFirebaseAuth();
  return FIREBASE_READY ? remote : local;
}

function MonthlyChart({ months, lang, t }) {
  const max = Math.max(1, ...months.flatMap((m) => [m.income, m.expense]));
  const W = 640, H = 240, padL = 46, padB = 30, padT = 10;
  const chartW = W - padL - 16, chartH = H - padB - padT;
  const groupW = chartW / months.length;
  const barW = Math.min(20, groupW * 0.28);

  const yTicks = 4;
  const gridLines = Array.from({ length: yTicks + 1 }, (_, i) => i / yTicks);

  return (
    <div className="overflow-x-auto no-scrollbar">
      <svg viewBox={"0 0 " + W + " " + H} className="w-full min-w-[520px]" style={{ height: 240 }}>
        {gridLines.map((f, i) => {
          const y = padT + chartH * (1 - f);
          return (
            <g key={i}>
              <line x1={padL} x2={W - 10} y1={y} y2={y} stroke="var(--line)" strokeWidth="1" />
              <text x={padL - 8} y={y + 3} textAnchor="end" fontSize="9" fill="var(--muted)">
                {f === 0 ? "0" : Math.round((max * f) / 1000) + "k"}
              </text>
            </g>
          );
        })}
        {months.map((m, i) => {
          const x0 = padL + i * groupW;
          const hInc = (m.income / max) * chartH;
          const hExp = (m.expense / max) * chartH;
          const cx = x0 + groupW / 2;
          return (
            <g key={i}>
              <rect x={cx - barW - 3} y={padT + chartH - hInc} width={barW} height={Math.max(hInc,1)} rx="3" fill="var(--green)" />
              <rect x={cx + 3} y={padT + chartH - hExp} width={barW} height={Math.max(hExp,1)} rx="3" fill="var(--rust)" />
              <text x={cx} y={H - 10} textAnchor="middle" fontSize="10" fill="var(--muted)">{monthLabel(m.key, lang)}</text>
            </g>
          );
        })}
      </svg>
      <div className="flex items-center gap-5 mt-2 px-1">
        <span className="flex items-center gap-1.5 text-xs" style={{ color: "var(--muted)" }}>
          <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ background: "var(--green)" }}></span>{t.income}
        </span>
        <span className="flex items-center gap-1.5 text-xs" style={{ color: "var(--muted)" }}>
          <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ background: "var(--rust)" }}></span>{t.expenses}
        </span>
      </div>
    </div>
  );
}

function LoginScreen({ authSys, lang, setLang }) {
  const t = T[lang];
  const isFirebase = authSys.mode === "firebase";
  const [id, setId] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  function submit(e) {
    e.preventDefault();
    if (!id.trim() || !password) { setError(t.fillAllFields); return; }
    setBusy(true);
    setError("");
    Promise.resolve(authSys.signIn(id, password))
      .catch((code) => setError(t[code] || t.invalidLogin))
      .finally(() => setBusy(false));
  }

  return (
    <AuthShell lang={lang} setLang={setLang}>
      <Card className="p-6 ledger-lines">
        <h2 className="font-display text-lg font-semibold mb-4">{t.signIn}</h2>
        <form onSubmit={submit}>
          <Field label={isFirebase ? t.email : t.username}>
            <input className={inputCls} style={inputStyle} value={id} onChange={(e) => setId(e.target.value)}
              type={isFirebase ? "email" : "text"} autoComplete="username" />
          </Field>
          <Field label={t.password}>
            <input type="password" className={inputCls} style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" />
          </Field>
          {error && <p className="text-sm mb-3" style={{ color: "var(--rust)" }}>{error}</p>}
          <Button type="submit" className="w-full mt-1" size="lg" disabled={busy}>{t.login}</Button>
        </form>
        <p className="text-xs mt-4 text-center" style={{ color: "var(--muted)" }}>{t.loginHelp}</p>
      </Card>
    </AuthShell>
  );
}

function BootstrapAdminScreen({ authSys, lang, setLang }) {
  const t = T[lang];
  const [form, setForm] = useState({ name: "", username: "", password: "" });
  const [error, setError] = useState("");

function ChangePasswordModal({ t, authSys, onClose }) {
  const [form, setForm] = useState({ current: "", next: "", confirm: "" });
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);
  const [busy, setBusy] = useState(false);

  function submit(e) {
    e.preventDefault();
    if (!form.current || form.next.length < 4) { setError(t.fillAllFields); return; }
    if (form.next !== form.confirm) { setError(t.passwordsDontMatch); return; }
    setBusy(true);
    setError("");
    Promise.resolve(authSys.changeOwnPassword(form.current, form.next))
      .then(() => setDone(true))
      .catch((code) => setError(t[code] || t.genericError))
      .finally(() => setBusy(false));
  }

  return (
    <Modal title={t.changePassword} onClose={onClose}>
      {done ? (
        <div className="text-center py-4">
          <Icon name="check" size={28} className="mx-auto mb-2" style={{ color: "var(--green)" }} />
          <p className="text-sm">{t.passwordUpdated}</p>
          <Button className="mt-4 w-full" onClick={onClose}>{t.close}</Button>
        </div>
      ) : (
        <form onSubmit={submit}>
          <Field label={t.currentPassword}>
            <input type="password" className={inputCls} style={inputStyle} value={form.current} onChange={(e) => setForm({ ...form, current: e.target.value })} autoComplete="current-password" />
          </Field>
          <Field label={t.newPassword}>
            <input type="password" className={inputCls} style={inputStyle} value={form.next} onChange={(e) => setForm({ ...form, next: e.target.value })} autoComplete="new-password" />
          </Field>
          <Field label={t.confirmNewPassword}>
            <input type="password" className={inputCls} style={inputStyle} value={form.confirm} onChange={(e) => setForm({ ...form, confirm: e.target.value })} autoComplete="new-password" />
          </Field>
          {error && <p className="text-xs mb-3" style={{ color: "var(--rust)" }}>{error}</p>}
          <div className="flex justify-end gap-2">
            <Button variant="outline" type="button" onClick={onClose}>{t.cancel}</Button>
            <Button type="submit" disabled={busy}>{t.updatePassword}</Button>
          </div>
        </form>
      )}
    </Modal>
  );
}

function StatCard({ icon, label, value, sub, accent }) {

    <Card className="p-4 sm:p-5">

        <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: accent + "22" }}>

      {sub && <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>{sub}</p>}
    </Card>

}

function Dashboard({ t, lang, data, categories }) {
  const months3 = availableMonths([data.incomes, data.expenses]);
  const [selMonth, setSelMonth] = useState(CURRENT_MONTH);
  const monthIncomes = data.incomes.filter((i) => monthKey(i.date) === selMonth);
  const monthExpenses = data.expenses.filter((e) => monthKey(e.date) === selMonth);
  const totalIncome = monthIncomes.reduce((s, i) => s + i.amount, 0);
  const totalExpense = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const totalBudget = Object.values(data.budgets).reduce((s, v) => s + v, 0);
  const remaining = totalBudget - totalExpense;
  const monthDeposits = data.savingsGoals.flatMap((g) => g.deposits).filter((d) => d.month === selMonth);
  const totalSavings = monthDeposits.reduce((s, d) => s + d.amount, 0);
  const usedPct = totalBudget > 0 ? (totalExpense / totalBudget) * 100 : 0;
  const isCurrent = selMonth === CURRENT_MONTH;

  const months = lastNMonths(6, selMonth).map((key) => ({
    key,
    income: data.incomes.filter((i) => monthKey(i.date) === key).reduce((s, i) => s + i.amount, 0),
    expense: data.expenses.filter((e) => monthKey(e.date) === key).reduce((s, e) => s + e.amount, 0),
  }));

  const catSpend = categories.map((c) => ({
    ...c, spent: monthExpenses.filter((e) => e.category === c.id).reduce((s, e) => s + e.amount, 0),
  })).sort((a, b) => b.spent - a.spent);
  const maxCat = Math.max(1, ...catSpend.map((c) => c.spent));

  const recent = [...monthIncomes.map((i) => ({ ...i, type: "income" })), ...monthExpenses.map((e) => ({ ...e, type: "expense" }))]
    .sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 6);

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t.dashboard}</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--muted)" }}>{t.dashboardSubtitle}</p>
        </div>
        <MonthSelect value={selMonth} onChange={setSelMonth} months={months3} lang={lang} />
      </div>

      {usedPct >= 80 && (
        <div className="flex items-start gap-3 p-4 rounded-xl border" style={{ background: "var(--rust-soft)", borderColor: "var(--rust)" }}>
          <Icon name="alert" size={20} style={{ color: "var(--rust)" }} className="shrink-0 mt-0.5" />
          <div>
            <p className="font-semibold text-sm" style={{ color: "var(--rust)" }}>{t.budgetAlert}</p>
            <p className="text-sm mt-0.5" style={{ color: "var(--ink)" }}>{t.budgetAlertMsg} ({Math.round(usedPct)}% {t.ofBudgetUsed})</p>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <StatCard icon="trendUp" label={t.totalIncome} value={fmtINR(totalIncome)} sub={isCurrent ? t.thisMonth : monthLabel(selMonth, lang)} accent="var(--green)" />
        <StatCard icon="trendDown" label={t.totalExpenses} value={fmtINR(totalExpense)} sub={isCurrent ? t.thisMonth : monthLabel(selMonth, lang)} accent="var(--rust)" />
        <StatCard icon="piggy" label={t.totalSavings} value={fmtINR(totalSavings)} sub={isCurrent ? t.thisMonth : monthLabel(selMonth, lang)} accent="var(--gold)" />
        <StatCard icon="target" label={t.remainingBudget} value={fmtINR(remaining)} sub={Math.round(usedPct) + "% " + t.ofBudgetUsed} accent="var(--teal-2)" />
      </div>

      <div className="grid lg:grid-cols-3 gap-4">
        <Card className="p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display font-semibold text-lg">{t.monthlyTrend}</h2>
            <span className="text-xs" style={{ color: "var(--muted)" }}>{t.last6}</span>
          </div>
          <MonthlyChart months={months} lang={lang} t={t} />
        </Card>

        <Card className="p-5">
          <h2 className="font-display font-semibold text-lg mb-4">{t.categoryBreakdown}</h2>
          <div className="space-y-3">
            {catSpend.map((c) => (
              <div key={c.id}>
                <div className="flex justify-between text-xs mb-1">
                  <span>{lang === "en" ? c.en : c.mr}</span>
                  <span style={{ color: "var(--muted)" }}>{fmtINR(c.spent)}</span>
                </div>
                <ProgressBar pct={(c.spent / maxCat) * 100} color={c.color} />
              </div>
            ))}
          </div>
        </Card>
      </div>

      <Card className="p-5">
        <h2 className="font-display font-semibold text-lg mb-3">{t.recentActivity}</h2>
        {recent.length === 0 ? <EmptyState icon="calendar" text={t.noActivity} /> : (
          <div className="divide-y" style={{ borderColor: "var(--line)" }}>
            {recent.map((r) => (
              <div key={r.id} className="flex items-center justify-between py-2.5">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                    style={{ background: r.type === "income" ? "var(--green-soft)" : "var(--rust-soft)" }}>
                    <Icon name={r.type === "income" ? "trendUp" : "trendDown"} size={15} style={{ color: r.type === "income" ? "var(--green)" : "var(--rust)" }} />
                  </div>
                  <div className="min-w-0">
                    <p className="text-sm font-medium truncate">{r.description}</p>
                    <p className="text-xs truncate" style={{ color: "var(--muted)" }}>{r.member} · {r.date}</p>
                  </div>
                </div>
                <span className="text-sm font-semibold shrink-0 ml-2" style={{ color: r.type === "income" ? "var(--green)" : "var(--rust)" }}>
                  {r.type === "income" ? "+" : "-"}{fmtINR(r.amount)}
                </span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function IncomeModal({ t, onClose, onSave, initial }) {
  const [form, setForm] = useState(initial || { member: "", date: todayStr(), amount: "", description: "" });
  const [err, setErr] = useState({});
  function submit(e) {
    e.preventDefault();
    const e2 = {};
    if (!form.member.trim()) e2.member = t.required;
    if (!form.date) e2.date = t.required;
    if (!form.amount || Number(form.amount) <= 0) e2.amount = t.positiveNumber;
    if (Object.keys(e2).length) { setErr(e2); return; }
    onSave({ ...form, amount: Number(form.amount), id: initial ? initial.id : uid() });
  }
  return (
    <Modal title={t.addIncome} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label={t.member} error={err.member}>
          <input className={inputCls} style={inputStyle} value={form.member} onChange={(e) => setForm({ ...form, member: e.target.value })} />
        </Field>
        <Field label={t.date} error={err.date}>
          <input type="date" className={inputCls} style={inputStyle} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
        </Field>
        <Field label={t.amount} error={err.amount}>
          <input type="number" min="0" className={inputCls} style={inputStyle} value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} />

function BudgetPage({ t, lang, budgets, expenses, categories, canEdit, onSaveBudgets, onOpenCategories }) {
  const [showModal, setShowModal] = useState(false);
  const [selMonth, setSelMonth] = useState(CURRENT_MONTH);
  const months = availableMonths([expenses]);
  const monthExpenses = expenses.filter((e) => monthKey(e.date) === selMonth);
  const totalBudget = Object.values(budgets).reduce((s, v) => s + v, 0);
  const totalSpent = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const usedPct = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t.budget}</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--muted)" }}>{t.budgetSubtitle}</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <MonthSelect value={selMonth} onChange={setSelMonth} months={months} lang={lang} />
          {canEdit && <Button variant="outline" onClick={onOpenCategories}><Icon name="edit" size={15} />{t.manageCategories}</Button>}
          {canEdit && <Button onClick={() => setShowModal(true)}><Icon name="edit" size={16} />{t.setBudget}</Button>}
        </div>
      </div>

      {!canEdit && <ViewOnlyBanner t={t} />}

      {usedPct >= 80 && (
        <div className="flex items-start gap-3 p-4 rounded-xl border" style={{ background: "var(--rust-soft)", borderColor: "var(--rust)" }}>
          <Icon name="alert" size={20} style={{ color: "var(--rust)" }} className="shrink-0 mt-0.5" />
          <p className="text-sm" style={{ color: "var(--ink)" }}><strong>{t.budgetAlert}:</strong> {t.budgetAlertMsg}</p>
        </div>
      )}

      <Card className="p-5">
        <div className="flex justify-between items-center mb-1">
          <span className="text-sm font-medium">{t.totalBudget}</span>
          <span className="font-display font-semibold">{fmtINR(totalSpent)} / {fmtINR(totalBudget)}</span>
        </div>
        <ProgressBar pct={usedPct} color={usedPct >= 80 ? "var(--rust)" : "var(--teal)"} />
      </Card>

      <div className="grid sm:grid-cols-2 gap-4">
        {categories.map((c) => {
          const spent = monthExpenses.filter((e) => e.category === c.id).reduce((s, e) => s + e.amount, 0);
          const limit = budgets[c.id] || 0;
          const pct = limit > 0 ? (spent / limit) * 100 : 0;
          const remaining = limit - spent;
          return (
            <Card key={c.id} className="p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="font-medium text-sm flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.color }}></span>
                  {lang === "en" ? c.en : c.mr}
                </span>
                <span className="text-xs" style={{ color: "var(--muted)" }}>{Math.round(pct)}%</span>
              </div>
              <ProgressBar pct={pct} color={pct >= 80 ? "var(--rust)" : c.color} />
              <div className="flex justify-between mt-2 text-xs" style={{ color: "var(--muted)" }}>
                <span>{t.spent}: {fmtINR(spent)}</span>
                <span>{t.remaining}: {fmtINR(remaining)}</span>
              </div>
              <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>{t.monthlyLimit}: {fmtINR(limit)}</p>
            </Card>
          );
        })}
      </div>

      {showModal && <BudgetModal t={t} lang={lang} categories={categories} budgets={budgets} onClose={() => setShowModal(false)}
        onSave={(v) => { onSaveBudgets(v); setShowModal(false); }} />}
    </div>
  );
}

function CategoryManagerModal({ t, lang, categories, expenses, onAdd, onDelete, onClose }) {
  const [form, setForm] = useState({ en: "", mr: "", color: CATEGORY_PALETTE[0] });
  const [err, setErr] = useState("");
  const [blocked, setBlocked] = useState(null);

  function submitAdd(e) {
    e.preventDefault();
    if (!form.en.trim()) { setErr(t.required); return; }
    let id = form.en.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    if (!id) id = uid();
    if (categories.some((c) => c.id === id)) { setErr(t.categoryExists); return; }
    onAdd({ id, en: form.en.trim(), mr: form.mr.trim() || form.en.trim(), color: form.color });
    setForm({ en: "", mr: "", color: CATEGORY_PALETTE[0] });
    setErr("");
  }

  function tryDelete(c) {
    const count = expenses.filter((e) => e.category === c.id).length;
    if (count > 0) { setBlocked({ name: lang === "en" ? c.en : c.mr, count }); return; }
    onDelete(c.id);
  }

  return (
    <Modal title={t.manageCategories} onClose={onClose} wide>
      <p className="text-xs font-semibold mb-2 uppercase tracking-wide" style={{ color: "var(--muted)" }}>{t.existingCategories}</p>
      <div className="space-y-2 mb-5">
        {categories.length === 0 && <p className="text-sm" style={{ color: "var(--muted)" }}>{t.noCategories}</p>}
        {categories.map((c) => (
          <div key={c.id} className="flex items-center justify-between p-2.5 rounded-lg border" style={{ borderColor: "var(--line)" }}>
            <span className="flex items-center gap-2 text-sm font-medium">
              <span className="w-3 h-3 rounded-full inline-block shrink-0" style={{ background: c.color }}></span>
              {lang === "en" ? c.en : c.mr}
            </span>
            <button onClick={() => tryDelete(c)} className="p-1.5 rounded-lg hover:bg-[var(--rust-soft)]" style={{ color: "var(--rust)" }}>
              <Icon name="trash" size={14} />
            </button>
          </div>
        ))}
      </div>

      <form onSubmit={submitAdd} className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
        <p className="text-sm font-semibold mb-3">{t.addCategory}</p>
        <Field label={t.categoryNameEn}>
          <input className={inputCls} style={inputStyle} value={form.en} onChange={(e) => setForm({ ...form, en: e.target.value })} />
        </Field>
        <Field label={t.categoryNameMr}>
          <input className={inputCls} style={inputStyle} value={form.mr} onChange={(e) => setForm({ ...form, mr: e.target.value })} />
        </Field>
        <Field label={t.categoryColor}>
          <div className="flex flex-wrap gap-2">
            {CATEGORY_PALETTE.map((col) => (
              <button type="button" key={col} onClick={() => setForm({ ...form, color: col })}
                className="w-7 h-7 rounded-full border-2"
                style={{ background: col, borderColor: form.color === col ? "var(--ink)" : "transparent" }} />
            ))}
          </div>
        </Field>
        {err && <p className="text-xs mb-3" style={{ color: "var(--rust)" }}>{err}</p>}
        <Button type="submit" size="sm"><Icon name="plus" size={14} />{t.addCategory}</Button>
      </form>

      {blocked && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4"
          onMouseDown={(e) => { if (e.target === e.currentTarget) setBlocked(null); }}>
          <div className="bg-[var(--surface)] rounded-2xl p-5 max-w-sm w-full" style={{ boxShadow: "var(--shadow)" }}>
            <div className="flex items-start gap-3 mb-4">
              <Icon name="alert" size={22} style={{ color: "var(--rust)" }} className="shrink-0 mt-0.5" />
              <div>
                <p className="font-semibold text-sm">{t.cannotDeleteCategory}</p>
                <p className="text-sm mt-1" style={{ color: "var(--muted)" }}>
                  <strong style={{ color: "var(--ink)" }}>{blocked.name}</strong> — {blocked.count} {t.recordsUsingCategory}
                </p>
              </div>
            </div>
            <div className="flex justify-end"><Button size="sm" onClick={() => setBlocked(null)}>{t.close}</Button></div>
          </div>
        </div>
      )}
    </Modal>
  );
}

  return (
    <Modal title={t.addDeposit + " — " + goal.name_en} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label={t.date}>
          <input type="date" className={inputCls} style={inputStyle} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
        </Field>
        <Field label={t.amount} error={err.amount}>
          <input type="number" min="0" className={inputCls} style={inputStyle} value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} />
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="outline" type="button" onClick={onClose}>{t.cancel}</Button>
          <Button type="submit">{t.save}</Button>
        </div>
      </form>
    </Modal>
  );
}

function SavingsPage({ t, lang, goals, canEdit, onAddGoal, onAddDeposit, onDeleteGoal }) {
  const [showGoalModal, setShowGoalModal] = useState(false);
  const [depositFor, setDepositFor] = useState(null);
  const [deleting, setDeleting] = useState(null);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t.savings}</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--muted)" }}>{t.savingsSubtitle}</p>
        </div>
        {canEdit && <Button onClick={() => setShowGoalModal(true)}><Icon name="plus" size={16} />{t.addGoal}</Button>}
      </div>

      {!canEdit && <ViewOnlyBanner t={t} />}

      {goals.length === 0 ? (
        <Card className="p-5"><EmptyState icon="piggy" text={t.noGoals} /></Card>
      ) : (
        <div className="grid sm:grid-cols-2 gap-4">
          {goals.map((g) => {
            const saved = g.deposits.reduce((s, d) => s + d.amount, 0);
            const pct = (saved / g.target) * 100;
            const reached = saved >= g.target;
            return (
              <Card key={g.id} className="p-5">
                <div className="flex items-start justify-between mb-2">
                  <div>
                    <p className="font-display font-semibold text-lg">{lang === "en" ? g.name_en : g.name_mr}</p>
                    <p className="text-xs mt-0.5" style={{ color: "var(--muted)" }}>{g.deposits.length} {t.deposits.toLowerCase()}</p>
                  </div>
                  {canEdit && (
                    <button onClick={() => setDeleting(g)} className="p-1.5 rounded-lg hover:bg-[var(--rust-soft)]" style={{ color: "var(--rust)" }}>
                      <Icon name="trash" size={15} />
                    </button>
                  )}
                </div>
                <ProgressBar pct={pct} color={reached ? "var(--green)" : "var(--gold)"} />
                <div className="flex justify-between mt-2 text-sm">
                  <span style={{ color: "var(--muted)" }}>{t.saved}: <strong style={{ color: "var(--ink)" }}>{fmtINR(saved)}</strong></span>
                  <span style={{ color: "var(--muted)" }}>{t.target}: {fmtINR(g.target)}</span>
                </div>
                {reached && <Badge color="var(--green)" soft="var(--green-soft)"><span className="flex items-center gap-1"><Icon name="check" size={12} />{t.goalReached}</span></Badge>}
                {canEdit && (
                  <Button size="sm" variant="outline" className="mt-3 w-full" onClick={() => setDepositFor(g)}>
                    <Icon name="plus" size={14} />{t.addDeposit}
                  </Button>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {showGoalModal && <GoalModal t={t} onClose={() => setShowGoalModal(false)} onSave={(g) => { onAddGoal(g); setShowGoalModal(false); }} />}
      {depositFor && <DepositModal t={t} goal={depositFor} onClose={() => setDepositFor(null)} onSave={(gid, dep) => { onAddDeposit(gid, dep); setDepositFor(null); }} />}
      {deleting && <ConfirmDialog t={t} onCancel={() => setDeleting(null)} onConfirm={() => { onDeleteGoal(deleting.id); setDeleting(null); }} />}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* USERS PAGE (ADMIN ONLY)                                                 */
/* ---------------------------------------------------------------------- */
function UserModal({ t, mode, onClose, onSave, initial }) {
  const isFirebase = mode === "firebase";
  const [form, setForm] = useState(initial || { name: "", username: "", email: "", password: "", role: "member", permission: "view" });
  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  const idKey = isFirebase ? "email" : "username";

  function submit(e) {
    e.preventDefault();
    const e2 = {};
    if (!form.name.trim()) e2.name = t.required;
    if (!form[idKey] || !form[idKey].trim()) e2[idKey] = t.required;
    if (!initial && (!form.password || form.password.length < (isFirebase ? 6 : 4))) e2.password = isFirebase ? t.weakPassword : t.required;
    if (Object.keys(e2).length) { setErr(e2); return; }
    setBusy(true);
    setErr({});
    Promise.resolve(onSave({ ...form, id: initial ? initial.id : uid() }))
      .then(() => onClose())
      .catch((code) => setErr({ [idKey]: t[code] || t.genericError }))
      .finally(() => setBusy(false));
  }

  return (
    <Modal title={initial ? t.editUser : t.newUser} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label={t.name} error={err.name}>
          <input className={inputCls} style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </Field>
        <Field label={isFirebase ? t.email : t.username} error={err[idKey]}>
          <input className={inputCls} style={inputStyle} type={isFirebase ? "email" : "text"} value={form[idKey] || ""} disabled={!!initial}
            onChange={(e) => setForm({ ...form, [idKey]: e.target.value })} />
        </Field>
        {!initial && (
          <Field label={isFirebase ? t.initialPassword : t.password} error={err.password}>
            <input type="password" className={inputCls} style={inputStyle} value={form.password || ""} onChange={(e) => setForm({ ...form, password: e.target.value })} />
            {isFirebase && <span className="block text-xs mt-1" style={{ color: "var(--muted)" }}>{t.initialPasswordHint}</span>}
          </Field>
        )}
        <Field label={t.role}>
          <select className={inputCls} style={inputStyle} value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>
            <option value="member">{t.memberRole}</option>
            <option value="admin">{t.admin}</option>
          </select>
        </Field>
        <Field label={t.permission}>
          <select className={inputCls} style={inputStyle} value={form.permission} onChange={(e) => setForm({ ...form, permission: e.target.value })}>
            <option value="edit">{t.editAdd}</option>
            <option value="view">{t.viewOnlyPerm}</option>
          </select>
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="outline" type="button" onClick={onClose}>{t.cancel}</Button>
          <Button type="submit" disabled={busy}>{t.save}</Button>
        </div>
      </form>
    </Modal>
  );
}

function UsersPage({ t, mode, users, currentUser, onAdd, onUpdate, onDelete, onResetPassword }) {
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [resetSentFor, setResetSentFor] = useState(null);
  const isFirebase = mode === "firebase";

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="font-display text-2xl font-semibold">{t.users}</h1>
          <p className="text-sm mt-0.5" style={{ color: "var(--muted)" }}>{t.usersSubtitle}</p>
        </div>
        <Button onClick={() => { setEditing(null); setShowModal(true); }}><Icon name="plus" size={16} />{t.addUser}</Button>
      </div>

      <Card className="p-4 sm:p-5">
        {users.length === 0 ? <EmptyState icon="users" text={t.noUsersYet} /> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left border-b" style={{ borderColor: "var(--line)", color: "var(--muted)" }}>
                  <th className="py-2 pr-3 font-medium">{t.name}</th>
                  <th className="py-2 pr-3 font-medium">{isFirebase ? t.email : t.username}</th>
                  <th className="py-2 pr-3 font-medium">{t.role}</th>
                  <th className="py-2 pr-3 font-medium">{t.permission}</th>
                  <th className="py-2 pl-3 font-medium text-right">{t.actions}</th>
                </tr>
              </thead>
              <tbody>
                {users.map((u) => (
                  <tr key={u.id} className="border-b last:border-0" style={{ borderColor: "var(--line)" }}>
                    <td className="py-2.5 pr-3 font-medium">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-semibold text-white shrink-0" style={{ background: "var(--gold)" }}>
                          {u.name.split(" ").map((w) => w[0]).slice(0, 2).join("")}
                        </div>
                        <span>{u.name}{u.id === currentUser.id && <span className="text-xs ml-1" style={{ color: "var(--muted)" }}>({t.myAccount})</span>}</span>
                      </div>
                    </td>
                    <td className="py-2.5 pr-3" style={{ color: "var(--muted)" }}>{isFirebase ? u.email : u.username}</td>
                    <td className="py-2.5 pr-3">
                      <Badge color={u.role === "admin" ? "var(--teal)" : "var(--ink)"} soft={u.role === "admin" ? "var(--gold-soft)" : "var(--surface-2)"}>
                        {u.role === "admin" ? t.admin : t.memberRole}
                      </Badge>
                    </td>
                    <td className="py-2.5 pr-3">
                      <Badge color={u.permission === "edit" ? "var(--green)" : "var(--muted)"} soft={u.permission === "edit" ? "var(--green-soft)" : "var(--surface-2)"}>
                        {u.permission === "edit" ? t.editAdd : t.viewOnlyPerm}
                      </Badge>
                    </td>
                    <td className="py-2.5 pl-3">
                      <div className="flex justify-end items-center gap-1">
                        {isFirebase && resetSentFor === u.id && (
                          <span className="text-[11px] mr-1" style={{ color: "var(--green)" }}>{t.resetPasswordSent}</span>
                        )}
                        {isFirebase && (
                          <button onClick={() => { Promise.resolve(onResetPassword(u.email)).then(() => setResetSentFor(u.id)).catch(() => {}); }}
                            className="p-1.5 rounded-lg hover:bg-[var(--surface-2)]" title={t.resetPassword}>
                            <Icon name="lock" size={15} />
                          </button>
                        )}
                        <button onClick={() => { setEditing(u); setShowModal(true); }} className="p-1.5 rounded-lg hover:bg-[var(--surface-2)]" title={t.edit}><Icon name="edit" size={15} /></button>
                        {u.id !== currentUser.id && (
                          <button onClick={() => setDeleting(u)} className="p-1.5 rounded-lg hover:bg-[var(--rust-soft)]" title={t.removeAccess} style={{ color: "var(--rust)" }}><Icon name="trash" size={15} /></button>
                        )}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {showModal && (
        <UserModal t={t} mode={mode} initial={editing} onClose={() => setShowModal(false)}
          onSave={(v) => (editing ? onUpdate(v) : onAdd(v))} />
      )}
      {deleting && (
        <ConfirmDialog t={{ ...t, confirmDeleteTitle: t.confirmRemoveTitle, confirmDeleteMsg: t.confirmRemoveMsg, delete: t.removeAccess }}
          onCancel={() => setDeleting(null)} onConfirm={() => { onDelete(deleting.id); setDeleting(null); }} />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* ROOT APP                                                                */
/* ---------------------------------------------------------------------- */
function App() {
  const authSys = useAuthSystem();
  const dataEnabled = authSys.mode === "local" ? true : authSys.status === "ready";
  const { data, setData, status } = useSharedData(dataEnabled);
  const [lang, setLang] = useState("en");
  const [page, setPage] = useState("dashboard");
  const [mobileOpen, setMobileOpen] = useState(false);
  const [showCategoryManager, setShowCategoryManager] = useState(false);
  const [showChangePassword, setShowChangePassword] = useState(false);
  const t = T[lang];

  if (authSys.status === "loading") return <LoadingScreen t={t} />;
  if (authSys.status === "needsBootstrap") return <BootstrapAdminScreen authSys={authSys} lang={lang} setLang={setLang} />;
  if (authSys.status === "signedOut") return <LoginScreen authSys={authSys} lang={lang} setLang={setLang} />;
  if (authSys.status === "noProfile") return <NoProfileScreen t={t} lang={lang} setLang={setLang} onSignOut={authSys.signOut} />;
  if (authSys.status === "error" || status === "error") return <ConnectionErrorScreen t={t} onRetry={() => window.location.reload()} />;
  if (!data) return <LoadingScreen t={t} />;

  const currentUser = authSys.currentUser;
  const { incomes, expenses, budgets, savingsGoals, categories } = data;
  const patch = (fn) => setData((prev) => fn(prev));

  const isAdmin = currentUser && currentUser.role === "admin";
  const canEdit = currentUser && (currentUser.role === "admin" || currentUser.permission === "edit");
  const pageProps = { t, lang, canEdit };

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "var(--bg)" }}>
      <TopBar t={t} lang={lang} setLang={setLang} user={currentUser} onLogout={authSys.signOut}
        onMenu={() => setMobileOpen(true)} syncStatus={status} onChangePassword={() => setShowChangePassword(true)} />
      <div className="flex flex-1 min-h-0">
        <Sidebar t={t} page={page} setPage={setPage} isAdmin={isAdmin} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
        <main className="flex-1 min-w-0 px-4 sm:px-6 py-6 pb-24 md:pb-6 max-w-6xl mx-auto w-full">
          {page === "dashboard" && <Dashboard t={t} lang={lang} categories={categories} data={{ incomes, expenses, budgets, savingsGoals }} />}
          {page === "income" && (
            <IncomePage {...pageProps} incomes={incomes}
              onAdd={(v) => patch((d) => ({ ...d, incomes: [...d.incomes, v] }))}
              onUpdate={(v) => patch((d) => ({ ...d, incomes: d.incomes.map((i) => (i.id === v.id ? v : i)) }))}
              onDelete={(id) => patch((d) => ({ ...d, incomes: d.incomes.filter((i) => i.id !== id) }))} />
          )}
          {page === "expenses" && (
            <ExpensePage {...pageProps} expenses={expenses} categories={categories} onOpenCategories={() => setShowCategoryManager(true)}
              onAdd={(v) => patch((d) => ({ ...d, expenses: [...d.expenses, v] }))}
              onUpdate={(v) => patch((d) => ({ ...d, expenses: d.expenses.map((e) => (e.id === v.id ? v : e)) }))}
              onDelete={(id) => patch((d) => ({ ...d, expenses: d.expenses.filter((e) => e.id !== id) }))} />
          )}
          {page === "budget" && (
            <BudgetPage {...pageProps} budgets={budgets} expenses={expenses} categories={categories}
              onOpenCategories={() => setShowCategoryManager(true)}
              onSaveBudgets={(b) => patch((d) => ({ ...d, budgets: b }))} />
          )}
          {page === "savings" && (
            <SavingsPage {...pageProps} goals={savingsGoals}
              onAddGoal={(g) => patch((d) => ({ ...d, savingsGoals: [...d.savingsGoals, g] }))}
              onAddDeposit={(gid, dep) => patch((d) => ({ ...d, savingsGoals: d.savingsGoals.map((g) => (g.id === gid ? { ...g, deposits: [...g.deposits, dep] } : g)) }))}
              onDeleteGoal={(id) => patch((d) => ({ ...d, savingsGoals: d.savingsGoals.filter((g) => g.id !== id) }))} />
          )}
          {page === "users" && isAdmin && (
            <UsersPage t={t} mode={authSys.mode} users={authSys.usersList || []} currentUser={currentUser}
              onAdd={authSys.addUser} onUpdate={authSys.updateUser} onDelete={authSys.deleteUser}
              onResetPassword={authSys.resetPasswordEmail} />
          )}
        </main>
      </div>
      {showCategoryManager && (
        <CategoryManagerModal t={t} lang={lang} categories={categories} expenses={expenses}
          onAdd={(c) => patch((d) => ({ ...d, categories: [...d.categories, c], budgets: { ...d.budgets, [c.id]: 0 } }))}
          onDelete={(id) => patch((d) => { const b = { ...d.budgets }; delete b[id]; return { ...d, categories: d.categories.filter((c) => c.id !== id), budgets: b }; })}
          onClose={() => setShowCategoryManager(false)} />
      )}
      {showChangePassword && <ChangePasswordModal t={t} authSys={authSys} onClose={() => setShowChangePassword(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
