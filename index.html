  }
  /* Mobile vs desktop navigation: plain CSS, independent of the Tailwind
     CDN script, so the layout is always correct even if that script is
     slow or blocked on a mobile network. */
  .gk-sidebar-desktop{ display:none; }
  .gk-bottom-nav{ display:flex; }
  @media (min-width:768px){
    .gk-sidebar-desktop{ display:flex; }
    .gk-bottom-nav{ display:none; }
  }
  .font-display{ font-family:'Fraunces','Noto Sans Devanagari',serif; font-optical-sizing:auto; }
  .ledger-lines{
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--line) 28px);

  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  input:focus, select:focus, button:focus-visible, textarea:focus{
    outline: 2px solid var(--gold); outline-offset:1px;
  }
  * { box-sizing: border-box; }
  .stamp{
    border:1.5px dashed var(--line);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
